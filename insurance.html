<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>شركات التأمين | صيدليات الهمسة</title>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 script src="./supabase-config.js"></script>
  <style>

    /* =====================================================
       HAMSA PHARMACY
       INSURANCE PAGE
       Orange Design
       ===================================================== */

    :root {
      --orange: #f97316;
      --orange-dark: #ea580c;
      --orange-deep: #c2410c;
      --orange-light: #fff7ed;
      --orange-soft: #ffedd5;

      --text: #292524;
      --muted: #78716c;
      --white: #ffffff;
      --border: #fed7aa;

      --shadow:
        0 8px 30px rgba(124, 45, 18, 0.09);
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        "Tahoma",
        "Arial",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #fffaf5 0%,
          #ffffff 35%
        );

      color: var(--text);

      min-height: 100vh;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .insurance-header {

      background:
        linear-gradient(
          135deg,
          var(--orange-dark),
          var(--orange)
        );

      color: white;

      padding: 18px 24px;

      position: sticky;
      top: 0;

      z-index: 100;

      box-shadow:
        0 4px 18px rgba(124, 45, 18, 0.18);
    }


    .header-inner {

      max-width: 1200px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .brand-icon {

      width: 48px;
      height: 48px;

      background: white;

      color: var(--orange-dark);

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 26px;
    }


    .brand-text h1 {

      font-size: 20px;

      margin-bottom: 3px;
    }


    .brand-text span {

      font-size: 12px;

      opacity: 0.9;
    }


    .back-button {

      border: 1px solid
        rgba(255,255,255,0.45);

      background:
        rgba(255,255,255,0.12);

      color: white;

      text-decoration: none;

      padding: 10px 16px;

      border-radius: 12px;

      font-size: 14px;

      transition: 0.2s;
    }


    .back-button:hover {

      background: white;

      color: var(--orange-dark);
    }


    /* =====================================================
       HERO
       ===================================================== */

    .insurance-hero {

      max-width: 1200px;

      margin: auto;

      padding:
        55px 20px 35px;

      text-align: center;
    }


    .hero-icon {

      width: 76px;
      height: 76px;

      margin: 0 auto 18px;

      border-radius: 24px;

      background: var(--orange-soft);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 40px;

      box-shadow:
        0 8px 25px
        rgba(249,115,22,0.12);
    }


    .insurance-hero h2 {

      font-size: 34px;

      color: var(--orange-deep);

      margin-bottom: 12px;
    }


    .insurance-hero p {

      max-width: 650px;

      margin: auto;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.9;
    }


    /* =====================================================
       COMPANIES
       ===================================================== */

    .companies-section {

      max-width: 1200px;

      margin: auto;

      padding:
        20px 20px 70px;
    }


    .companies-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 22px;
    }


    /* =====================================================
       COMPANY CARD
       ===================================================== */

    .company-card {

      position: relative;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 22px;

      min-height: 190px;

      padding: 28px 20px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      cursor: pointer;

      text-decoration: none;

      color: var(--text);

      box-shadow: var(--shadow);

      overflow: hidden;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }


    .company-card::before {

      content: "";

      position: absolute;

      top: 0;
      right: 0;
      left: 0;

      height: 5px;

      background:
        linear-gradient(
          90deg,
          var(--orange-deep),
          var(--orange),
          #fb923c
        );
    }


    .company-card:hover {

      transform:
        translateY(-7px);

      border-color:
        var(--orange);

      box-shadow:
        0 16px 38px
        rgba(124,45,18,0.14);
    }


    .company-icon {

      width: 72px;
      height: 72px;

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          var(--orange-soft),
          #fff
        );

      border:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 34px;

      margin-bottom: 16px;

      transition: 0.25s;
    }


    .company-card:hover
    .company-icon {

      transform:
        scale(1.08);

      background:
        var(--orange);
    }


    .company-name {

      font-size: 17px;

      font-weight: 800;

      color: var(--text);

      line-height: 1.6;

      margin-bottom: 8px;
    }


    .company-action {

      color:
        var(--orange-dark);

      font-size: 13px;

      font-weight: 700;
    }


    .company-arrow {

      position: absolute;

      bottom: 15px;
      left: 18px;

      width: 30px;
      height: 30px;

      border-radius: 50%;

      background:
        var(--orange-light);

      color:
        var(--orange-dark);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 17px;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {

      grid-column: 1 / -1;

      text-align: center;

      padding: 60px 20px;

      color: var(--orange-dark);

      font-size: 16px;
    }


    .loading-spinner {

      width: 42px;
      height: 42px;

      border:
        4px solid var(--orange-soft);

      border-top-color:
        var(--orange);

      border-radius: 50%;

      margin:
        0 auto 15px;

      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       EMPTY / ERROR
       ===================================================== */

    .message-box {

      grid-column: 1 / -1;

      background: white;

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 45px 20px;

      text-align: center;

      color: var(--muted);

      box-shadow: var(--shadow);
    }


    .message-box strong {

      display: block;

      color: var(--orange-dark);

      font-size: 20px;

      margin-bottom: 10px;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {

      background:
        #fff7ed;

      border-top:
        1px solid var(--border);

      text-align: center;

      padding: 22px;

      color: var(--muted);

      font-size: 13px;
    }


    footer strong {

      color: var(--orange-dark);
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1000px) {

      .companies-grid {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

    }


    @media (max-width: 700px) {

      .insurance-header {

        padding: 14px 15px;
      }


      .brand-icon {

        width: 42px;
        height: 42px;

        font-size: 22px;
      }


      .brand-text h1 {

        font-size: 16px;
      }


      .brand-text span {

        display: none;
      }


      .back-button {

        padding:
          9px 12px;

        font-size: 12px;
      }


      .insurance-hero {

        padding:
          40px 16px 25px;
      }


      .insurance-hero h2 {

        font-size: 27px;
      }


      .insurance-hero p {

        font-size: 14px;
      }


      .companies-section {

        padding:
          15px 12px 50px;
      }


      .companies-grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 12px;
      }


      .company-card {

        min-height: 165px;

        padding:
          22px 12px;
      }


      .company-icon {

        width: 60px;
        height: 60px;

        font-size: 28px;

        border-radius: 17px;
      }


      .company-name {

        font-size: 14px;
      }


      .company-action {

        font-size: 11px;
      }

    }


    @media (max-width: 380px) {

      .companies-grid {

        gap: 9px;
      }


      .company-card {

        min-height: 150px;
      }

    }

  </style>

</head>


<body>


  <!-- ===================================================
       HEADER
       =================================================== -->

  <header class="insurance-header">

    <div class="header-inner">

      <div class="brand">

        <div class="brand-icon">
          🏥
        </div>

        <div class="brand-text">

          <h1>
            صيدليات الهمسة
          </h1>

          <span>
            خدمات التأمين الطبي
          </span>

        </div>

      </div>


      <a
        href="index.html"
        class="back-button"
      >
        ← العودة للرئيسية
      </a>

    </div>

  </header>



  <!-- ===================================================
       HERO
       =================================================== -->

  <section class="insurance-hero">

    <div class="hero-icon">
      🛡️
    </div>

    <h2>
      شركات التأمين
    </h2>

    <p>
      اختر شركة التأمين الخاصة بك
      لبدء طلب العلاج والخدمات التأمينية
      من صيدليات الهمسة.
    </p>

  </section>



  <!-- ===================================================
       COMPANIES
       =================================================== -->

  <main class="companies-section">

    <div
      id="insurance-companies"
      class="companies-grid"
    >

      <div class="loading">

        <div class="loading-spinner"></div>

        جاري تحميل شركات التأمين...

      </div>

    </div>

  </main>



  <!-- ===================================================
       FOOTER
       =================================================== -->

  <footer>

    ©
    <span id="current-year"></span>

    <strong>
      صيدليات الهمسة
    </strong>

    — جميع الحقوق محفوظة

  </footer>



  <!-- ===================================================
       PAGE SCRIPT
       =================================================== -->

  <script>

    const InsurancePage = {

      async init() {

        this.updateYear();

        await this.loadCompanies();

      },


      updateYear() {

        const year =
          document.getElementById(
            'current-year'
          );

        if (year) {

          year.textContent =
            new Date().getFullYear();

        }

      },


      async loadCompanies() {

        const container =
          document.getElementById(
            'insurance-companies'
          );

        if (!container) return;


        if (
          typeof supabaseClient === 'undefined' ||
          !supabaseClient
        ) {

          this.showMessage(
            container,
            'تعذر الاتصال بقاعدة البيانات'
          );

          return;

        }


        try {

          const {
            data,
            error
          } = await supabaseClient

            .from('insurance')

            .select(
              'id, name, active'
            )

            .eq(
              'active',
              true
            )

            .order(
              'name',
              {
                ascending: true
              }
            );


          if (error) {

            throw error;

          }


          if (
            !Array.isArray(data) ||
            data.length === 0
          ) {

            this.showMessage(
              container,
              'لا توجد شركات تأمين متاحة حاليًا'
            );

            return;

          }


          container.innerHTML =
            data.map(company => {

              return `

                <a
                  class="company-card"
                  href="insurance-request.html?insurance_id=${encodeURIComponent(company.id)}"
                >

                  <div class="company-icon">
                    🏥
                  </div>

                  <div class="company-name">
                    ${this.escape(company.name)}
                  </div>

                  <div class="company-action">
                    اضغط لبدء طلب التأمين
                  </div>

                  <div class="company-arrow">
                    ←
                  </div>

                </a>

              `;

            }).join('');


          console.log(
            '✅ Insurance companies loaded:',
            data.length
          );


        } catch (error) {

          console.error(
            '❌ Insurance loading error:',
            error
          );


          this.showMessage(
            container,
            'حدث خطأ أثناء تحميل شركات التأمين'
          );

        }

      },


      showMessage(
        container,
        message
      ) {

        container.innerHTML = `

          <div class="message-box">

            <strong>
              شركات التأمين
            </strong>

            ${this.escape(message)}

          </div>

        `;

      },


      escape(value) {

        return String(
          value ?? ''
        )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

      }

    };


    document.addEventListener(
      'DOMContentLoaded',
      () => {

        InsurancePage.init();

      }
    );

  </script>

</body>

</html>
