
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>دخول الإدارة - صيدليات الهمسة</title>

  <meta
    name="description"
    content="تسجيل الدخول إلى لوحة إدارة صيدليات الهمسة"
  >

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        linear-gradient(
          135deg,
          #f5f9ff 0%,
          #eef5ff 50%,
          #ffffff 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-login-wrapper {
      width: 100%;
      max-width: 430px;
    }

    .admin-login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
      border: 1px solid #e8eef7;
    }

    .admin-login-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .admin-login-logo .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 15px;
      border-radius: 18px;
      background: #0d6efd;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .admin-login-logo h1 {
      margin: 0 0 8px;
      color: #17324d;
      font-size: 25px;
    }

    .admin-login-logo p {
      margin: 0;
      color: #718096;
      font-size: 14px;
    }

    .admin-login-form {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .admin-login-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .admin-login-field label {
      font-weight: 700;
      color: #26384a;
      font-size: 14px;
    }

    .admin-login-field input {
      width: 100%;
      height: 48px;
      border: 1px solid #d6dfeb;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    .admin-login-field input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.10);
    }

    .admin-login-button {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      background: #0d6efd;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .admin-login-button:hover {
      background: #0b5ed7;
    }

    .admin-login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .admin-login-message {
      display: none;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.6;
    }

    .admin-login-message.error {
      display: block;
      color: #842029;
      background: #f8d7da;
      border: 1px solid #f5c2c7;
    }

    .admin-login-message.success {
      display: block;
      color: #0f5132;
      background: #d1e7dd;
      border: 1px solid #badbcc;
    }

    .admin-login-footer {
      text-align: center;
      margin-top: 22px;
      color: #8a97a6;
      font-size: 12px;
    }

    .admin-login-back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #0d6efd;
      text-decoration: none;
      font-size: 14px;
    }

    .admin-login-back:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .admin-login-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="admin-login-wrapper">

    <div class="admin-login-card">

      <div class="admin-login-logo">
        <div class="icon">💊</div>

        <h1>لوحة إدارة الهمسة</h1>

        <p>تسجيل الدخول للمدير</p>
      </div>

      <div
        id="admin-login-message"
        class="admin-login-message"
        role="alert"
      ></div>

      <form id="admin-login-form" class="admin-login-form">

        <div class="admin-login-field">
          <label for="admin-email">
            البريد الإلكتروني
          </label>

          <input
            type="email"
            id="admin-email"
            name="email"
            autocomplete="email"
            placeholder="أدخل البريد الإلكتروني"
            required
          >
        </div>

        <div class="admin-login-field">
          <label for="admin-password">
            كلمة المرور
          </label>

          <input
            type="password"
            id="admin-password"
            name="password"
            autocomplete="current-password"
            placeholder="أدخل كلمة المرور"
            required
          >
        </div>

        <button
          type="submit"
          id="admin-login-button"
          class="admin-login-button"
        >
          تسجيل الدخول
        </button>

      </form>

      <a href="index.html" class="admin-login-back">
        ← العودة إلى الموقع
      </a>

      <div class="admin-login-footer">
        © <span id="admin-login-year"></span> صيدليات الهمسة
      </div>

    </div>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase configuration -->
  <script src="js/supabase-config.js"></script>

  <!-- Admin authentication -->
  <script src="js/auth.js"></script>

</body>
</html>
