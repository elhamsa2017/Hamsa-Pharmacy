<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>صيدليات الهمسة</title>

  <meta
    name="description"
    content="صيدليات الهمسة - منتجات صيدلية وعناية شخصية"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="site-header">

    <div class="container header-inner">

      <a href="index.html" class="logo">
        صيدليات الهمسة
      </a>

      <div class="header-actions">

        <select
          id="language-select"
          class="header-button language-select"
          aria-label="اختيار اللغة"
        >
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>

        <button
          type="button"
          id="search-button"
          class="header-button"
        >
          🔍 <span data-i18n="search">البحث</span>
        </button>

        <button
          type="button"
          id="cart-button"
          class="header-button"
        >
          🛒 <span data-i18n="cart">السلة</span>
          <span id="cart-count">0</span>
        </button>

        <button
          type="button"
          id="account-button"
          class="header-button"
        >
          👤 <span data-i18n="account">حسابي</span>
        </button>

        <a
          href="insurance.html"
          class="header-button"
        >
          🛡️ <span data-i18n="insurance">التأمين</span>
        </a>

      </div>

    </div>

  </header>


  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <section
    id="search-section"
    class="search-section"
    hidden
  >

    <div class="container">

      <input
        type="search"
        id="search-input"
        placeholder="ابحث عن اسم المنتج أو الكود..."
        data-i18n-placeholder="searchPlaceholder"
        autocomplete="off"
      >

    </div>

  </section>


  <!-- =====================================================
       HERO
  ====================================================== -->

  <main>

    <section class="hero">

      <div class="container">

        <h1>
          <span data-i18n="welcome">أهلًا بكم في صيدليات الهمسة</span>
        </h1>

        <p>
          <span data-i18n="priority">صحتك وراحتك أولويتنا</span>
        </p>

      </div>

    </section>


    <!-- ===================================================
         CATEGORIES
    ==================================================== -->

    <section class="categories-section">

      <div class="container">

        <div class="section-title">

          <h2>
            <span data-i18n="categories">التصنيفات</span>
          </h2>

        </div>

        <div
          id="categories-container"
          class="categories-grid"
        >
          <p class="loading">
            <span data-i18n="loadingCategories">جاري تحميل التصنيفات...</span>
          </p>
        </div>

      </div>

    </section>


    <!-- ===================================================
         PRODUCTS
    ==================================================== -->

    <section class="products-section">

      <div class="container">

        <div class="section-title">

          <h2 id="products-title">
            <span data-i18n="products">المنتجات</span>
          </h2>

        </div>

        <div
          id="products-container"
          class="products-grid"
        >
          <p class="loading">
            <span data-i18n="loadingProducts">جاري تحميل المنتجات...</span>
          </p>
        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    <div class="container">

      <p>
        © <span id="current-year"></span>
        صيدليات الهمسة
      </p>

    </div>

  </footer>


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="js/supabase-config.js"></script>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
