<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب - صيدليات الهمسة</title>

  <meta
    name="description"
    content="إتمام طلبك من صيدليات الهمسة"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .checkout-container {
      width: min(100% - 30px, 1000px);
      margin: 30px auto;
    }

    .checkout-header {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .checkout-header h1 {
      margin: 0 0 8px;
      color: #155e75;
      font-size: 26px;
    }

    .checkout-header p {
      margin: 0;
      color: #666;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .checkout-card {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .checkout-card h2 {
      margin-top: 0;
      color: #155e75;
      font-size: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #155e75;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item-image {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      overflow: hidden;
      background: #f1f3f5;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .order-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-info h3 {
      margin: 0 0 5px;
      font-size: 15px;
    }

    .order-item-info p {
      margin: 3px 0;
      color: #666;
      font-size: 13px;
    }

    .order-item-total {
      font-weight: bold;
      white-space: nowrap;
    }

    .summary {
      margin-top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
    }

    .summary-row.total {
      border-top: 2px solid #eee;
      margin-top: 8px;
      padding-top: 15px;
      font-size: 20px;
      color: #155e75;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      background: #155e75;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: .92;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #155e75;
      font-weight: bold;
    }

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-cart-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .message.success {
      display: block;
      background: #e8f7ee;
      color: #16703a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a52222;
    }

    @media (max-width: 750px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }

      .checkout-container {
        width: min(100% - 20px, 1000px);
        margin: 15px auto;
      }

      .checkout-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="checkout-container">

    <a href="index.html" class="back-button">
      ← العودة للمتجر
    </a>

    <section class="checkout-header">
      <h1>إتمام الطلب 🛒</h1>
      <p>أكملي بياناتك لتأكيد طلبك من صيدليات الهمسة</p>
    </section>

    <div id="checkout-content">

      <div class="checkout-grid">

        <!-- بيانات العميل -->
        <section class="checkout-card">

          <h2>بيانات العميل</h2>

          <form id="checkout-form">

            <div class="form-group">
              <label for="customer-name">
                الاسم *
              </label>

              <input
                type="text"
                id="customer-name"
                required
                autocomplete="name"
                placeholder="اكتبي الاسم"
              >
            </div>

            <div class="form-group">
              <label for="customer-phone">
                رقم الهاتف *
              </label>

              <input
                type="tel"
                id="customer-phone"
                required
                autocomplete="tel"
                placeholder="01xxxxxxxxx"
              >
            </div>

            <div class="form-group">
              <label for="customer-address">
                العنوان *
              </label>

              <textarea
                id="customer-address"
                required
                autocomplete="street-address"
                placeholder="اكتبي عنوان التوصيل بالتفصيل"
              ></textarea>
            </div>

            <div class="form-group">
              <label for="payment-method">
                طريقة الدفع *
              </label>

              <select
                id="payment-method"
                required
              >
                <option value="">
                  اختاري طريقة الدفع
                </option>

                <option value="cash">
                  الدفع عند الاستلام
                </option>

                <option value="pickup">
                  الاستلام من الصيدلية
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="order-notes">
                ملاحظات إضافية
              </label>

              <textarea
                id="order-notes"
                placeholder="أي ملاحظات خاصة بالطلب..."
              ></textarea>
            </div>

            <div
              id="checkout-message"
              class="message"
            ></div>

            <button
              type="submit"
              id="submit-order"
              class="submit-button"
            >
              تأكيد الطلب
            </button>

          </form>

        </section>


        <!-- ملخص الطلب -->
        <section class="checkout-card">

          <h2>ملخص الطلب</h2>

          <div id="order-items"></div>

          <div class="summary">

            <div class="summary-row">
              <span>إجمالي المنتجات</span>
              <strong id="order-subtotal">
                0.00 ج.م
              </strong>
            </div>

            <div class="summary-row">
              <span>التوصيل</span>
              <strong id="order-delivery">
                0.00 ج.م
              </strong>
            </div>

            <div class="summary-row total">
              <span>الإجمالي النهائي</span>
              <strong id="order-total">
                0.00 ج.م
              </strong>
            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Config -->
  <script src="js/supabase-config.js"></script>


  <script>

    const Checkout = {

      cart: [],

      init() {

        console.log('🧾 Checkout starting...');

        this.loadCart();

        this.render();

        this.bindEvents();

      },


      loadCart() {

        try {

          const saved =
            localStorage.getItem('hamsa_cart');

          const parsed =
            saved ? JSON.parse(saved) : [];

          this.cart =
            Array.isArray(parsed)
              ? parsed
              : [];

        } catch (error) {

          console.error(
            'Cart loading error:',
            error
          );

          this.cart = [];

        }

      },


      render() {

        const container =
          document.getElementById(
            'order-items'
          );

        if (!container) return;


        if (!this.cart.length) {

          container.innerHTML = `

            <div class="empty-cart">

              <div class="empty-cart-icon">
                🛒
              </div>

              <h3>
                السلة فارغة
              </h3>

              <p>
                أضيفي منتجات أولًا ثم عودي لإتمام الطلب.
              </p>

              <a href="index.html">
                العودة للمتجر
              </a>

            </div>

          `;

          document.getElementById(
            'submit-order'
          ).disabled = true;

          return;

        }


        container.innerHTML =
          this.cart.map(item => {

            const price =
              Number(item.price) || 0;

            const quantity =
              Number(item.quantity) || 0;

            const total =
              price * quantity;

            const image =
              item.image || '';


            return `

              <div class="order-item">

                <div class="order-item-image">

                  ${
                    image

                      ? `
                        <img
                          src="${this.escape(image)}"
                          alt="${this.escape(item.name)}"
                        >
                      `

                      : `
                        <span>💊</span>
                      `
                  }

                </div>

                <div class="order-item-info">

                  <h3>
                    ${this.escape(item.name)}
                  </h3>

                  <p>
                    الكمية: ${quantity}
                  </p>

                  <p>
                    السعر: ${price.toFixed(2)} ج.م
                  </p>

                </div>

                <div class="order-item-total">
                  ${total.toFixed(2)} ج.م
                </div>

              </div>

            `;

          }).join('');


        const subtotal =
          this.getSubtotal();

        const deliveryFee = 0;

        const total =
          subtotal + deliveryFee;


        document.getElementById(
          'order-subtotal'
        ).textContent =
          `${subtotal.toFixed(2)} ج.م`;


        document.getElementById(
          'order-delivery'
        ).textContent =
          `${deliveryFee.toFixed(2)} ج.م`;


        document.getElementById(
          'order-total'
        ).textContent =
          `${total.toFixed(2)} ج.م`;

      },


      getSubtotal() {

        return this.cart.reduce(
          (sum, item) => {

            const price =
              Number(item.price) || 0;

            const quantity =
              Number(item.quantity) || 0;

            return sum +
              (price * quantity);

          },
          0
        );

      },


      bindEvents() {

        document
          .getElementById('checkout-form')
          ?.addEventListener(
            'submit',
            event => {

              event.preventDefault();

              this.submitOrder();

            }
          );

      },


      async submitOrder() {

        if (!this.cart.length) {

          this.showMessage(
            'السلة فارغة',
            true
          );

          return;

        }


        const name =
          document.getElementById(
            'customer-name'
          ).value.trim();


        const phone =
          document.getElementById(
            'customer-phone'
          ).value.trim();


        const address =
          document.getElementById(
            'customer-address'
          ).value.trim();


        const paymentMethod =
          document.getElementById(
            'payment-method'
          ).value;


        const notes =
          document.getElementById(
            'order-notes'
          ).value.trim();


        if (
          !name ||
          !phone ||
          !address ||
          !paymentMethod
        ) {

          this.showMessage(
            'برجاء إدخال جميع البيانات المطلوبة',
            true
          );

          return;

        }


        const subtotal =
          this.getSubtotal();


        /*
         * مؤقتًا رسوم التوصيل = صفر
         *
         * هنربطها لاحقًا
         * بحساب المسافة والإعدادات.
         */

        const deliveryFee = 0;

        const total =
          subtotal + deliveryFee;


        const items =
          this.cart.map(item => ({

            id: item.id,

            sku:
              item.sku || null,

            name:
              item.name || '',

            price:
              Number(item.price) || 0,

            quantity:
              Number(item.quantity) || 0,

            is_offer:
              Boolean(item.is_offer),

            image:
              item.image || null

          }));


        const order = {

          id:
            this.generateOrderId(),

          user_id:
            null,

          customer_name:
            name,

          customer_phone:
            phone,

          customer_address:
            address,

          items:
            items,

          subtotal:
            subtotal,

          delivery_fee:
            deliveryFee,

          total:
            total,

          status:
            'pending',

          payment_method:
            paymentMethod,

          notes:
            notes || null,

          delivery_notified:
            false

        };


        const button =
          document.getElementById(
            'submit-order'
          );


        button.disabled = true;

        button.textContent =
          'جاري إرسال الطلب...';


        try {

          const {
            data,
            error
          } = await supabaseClient
            .from('orders')
            .insert(order)
            .select()
            .single();


          if (error) {

            console.error(
              '❌ Order insert error:',
              error
            );

            throw error;

          }


          console.log(
            '✅ Order created:',
            data
          );


          /*
           * تفريغ السلة بعد نجاح الطلب فقط
           */

          localStorage.removeItem(
            'hamsa_cart'
          );


          this.cart = [];


          this.showMessage(
            `تم إرسال طلبك بنجاح 🎉
             رقم الطلب: ${data.id}`,
            false
          );


          button.textContent =
            'تم تأكيد الطلب ✓';


          /*
           * منع إرسال الطلب مرة أخرى
           */

          button.disabled = true;


        } catch (error) {

          console.error(
            '❌ Failed to create order:',
            error
          );


          this.showMessage(
            'حدث خطأ أثناء إرسال الطلب. برجاء المحاولة مرة أخرى.',
            true
          );


          button.disabled = false;

          button.textContent =
            'تأكيد الطلب';

        }

      },


      generateOrderId() {

        return (
          'ORD-' +
          Date.now() +
          '-' +
          Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase()
        );

      },


      showMessage(message, error = false) {

        const element =
          document.getElementById(
            'checkout-message'
          );

        if (!element) return;


        element.textContent =
          message;


        element.className =
          `message ${error ? 'error' : 'success'}`;

      },


      escape(value) {

        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');

      }

    };


    document.addEventListener(
      'DOMContentLoaded',
      () => Checkout.init()
    );

  </script>

</body>
</html>
