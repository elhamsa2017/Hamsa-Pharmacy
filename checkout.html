<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إتمام الطلب - صيدليات الهمسة</title>

  <meta
    name="description"
    content="إتمام طلبك من صيدليات الهمسة"
  >

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .checkout-container {
      width: min(100% - 30px, 1000px);
      margin: 30px auto;
    }

    .checkout-header {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .06);
    }

    .checkout-header h1 {
      margin: 0 0 8px;
      color: #155e75;
      font-size: 26px;
    }

    .checkout-header p {
      margin: 0;
      color: #666;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .checkout-card {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .06);
    }

    .checkout-card h2 {
      margin-top: 0;
      color: #155e75;
      font-size: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }

    /* =========================
       FORM
       ========================= */

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #155e75;
    }

    .form-group textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* =========================
       LOCATION
       ========================= */

    .location-section {
      margin-top: 15px;
      margin-bottom: 15px;
    }

    .location-label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .location-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #0f766e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: .2s ease;
    }

    .location-button:hover {
      opacity: .92;
    }

    .location-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #delivery-map {
      width: 100%;
      height: 320px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #eef2f3;
    }

    .location-info {
      margin-top: 10px;
      padding: 12px;
      background: #f5f7f8;
      border-radius: 10px;
      font-size: 14px;
      color: #444;
      line-height: 1.8;
    }

    .distance-box {
      margin-top: 10px;
      padding: 12px;
      background: #eef8f7;
      border: 1px solid #d4eeeb;
      border-radius: 10px;
      line-height: 1.8;
    }

    .distance-box strong {
      color: #0f766e;
    }

    .pharmacy-label {
      font-size: 13px;
      font-weight: bold;
    }

    /* =========================
       ORDER ITEMS
       ========================= */

    .order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item-image {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      overflow: hidden;
      background: #f1f3f5;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .order-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .order-item-info {
      flex: 1;
      min-width: 0;
    }

    .order-item-info h3 {
      margin: 0 0 5px;
      font-size: 15px;
      line-height: 1.5;
    }

    .order-item-info p {
      margin: 3px 0;
      color: #666;
      font-size: 13px;
    }

    .order-item-total {
      font-weight: bold;
      white-space: nowrap;
    }

    /* =========================
       SUMMARY
       ========================= */

    .summary {
      margin-top: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 9px 0;
    }

    .summary-row.total {
      border-top: 2px solid #eee;
      margin-top: 8px;
      padding-top: 15px;
      font-size: 20px;
      color: #155e75;
    }

    /* =========================
       BUTTONS
       ========================= */

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      background: #155e75;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s ease;
    }

    .submit-button:hover {
      opacity: .92;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #155e75;
      font-weight: bold;
    }

    /* =========================
       EMPTY
       ========================= */

    .empty-cart {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-cart-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    /* =========================
       MESSAGE
       ========================= */

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      white-space: pre-line;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      background: #e8f7ee;
      color: #16703a;
    }

    .message.error {
      display: block;
      background: #fdecec;
      color: #a52222;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 750px) {

      .checkout-grid {
        grid-template-columns: 1fr;
      }

      .checkout-container {
        width: min(100% - 20px, 1000px);
        margin: 15px auto;
      }

      .checkout-card {
        padding: 17px;
      }

      #delivery-map {
        height: 280px;
      }

      .order-item {
        align-items: flex-start;
      }

      .order-item-total {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="checkout-container">

    <a href="index.html" class="back-button">
      ← العودة للمتجر
    </a>

    <section class="checkout-header">
      <h1>إتمام الطلب 🛒</h1>

      <p>
        أكمل بياناتك لتأكيد طلبك من صيدليات الهمسة
      </p>
    </section>


    <div id="checkout-content">

      <div class="checkout-grid">

        <!-- =========================
             CUSTOMER DATA
             ========================= -->

        <section class="checkout-card">

          <h2>
            بيانات العميل
          </h2>

          <form id="checkout-form">

            <!-- NAME -->

            <div class="form-group">

              <label for="customer-name">
                الاسم *
              </label>

              <input
                type="text"
                id="customer-name"
                required
                autocomplete="name"
                placeholder="اكتب الاسم"
              >

            </div>


            <!-- PHONE -->

            <div class="form-group">

              <label for="customer-phone">
                رقم الهاتف *
              </label>

              <input
                type="tel"
                id="customer-phone"
                required
                autocomplete="tel"
                placeholder="01xxxxxxxxx"
              >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

              <label for="customer-address">
                العنوان *
              </label>

              <textarea
                id="customer-address"
                required
                autocomplete="street-address"
                placeholder="اكتب عنوان التوصيل بالتفصيل"
              ></textarea>

            </div>


            <!-- =========================
                 LOCATION
                 ========================= -->

            <div class="location-section">

              <label class="location-label">
                📍 موقع التوصيل
              </label>

              <button
                type="button"
                id="get-location-button"
                class="location-button"
              >
                📍 تحديد موقعي الحالي
              </button>

              <div id="delivery-map"></div>

              <div
                id="location-info"
                class="location-info"
              >
                لم يتم تحديد موقعك بعد.
                <br>
                يمكنك الضغط على الخريطة لتحديد موقع التوصيل يدويًا.
              </div>

              <div
                id="distance-info"
                class="distance-box"
                hidden
              >

                📏 المسافة من الصيدلية:
                <strong id="delivery-distance">
                  0.00 كم
                </strong>

              </div>

            </div>


            <!-- =========================
                 PAYMENT
                 ========================= -->

            <div class="form-group">

              <label for="payment-method">
                طريقة الدفع *
              </label>

              <select
                id="payment-method"
                required
              >

                <option value="">
                  اختاري طريقة الدفع
                </option>

                <option value="cash">
                  الدفع عند الاستلام
                </option>

                <option value="pickup">
                  الاستلام من الصيدلية
                </option>

              </select>

            </div>


            <!-- =========================
                 NOTES
                 ========================= -->

            <div class="form-group">

              <label for="order-notes">
                ملاحظات إضافية
              </label>

              <textarea
                id="order-notes"
                placeholder="أي ملاحظات خاصة بالطلب..."
              ></textarea>

            </div>


            <!-- MESSAGE -->

            <div
              id="checkout-message"
              class="message"
            ></div>


            <!-- SUBMIT -->

            <button
              type="submit"
              id="submit-order"
              class="submit-button"
            >
              تأكيد الطلب
            </button>

          </form>

        </section>


        <!-- =========================
             ORDER SUMMARY
             ========================= -->

        <section class="checkout-card">

          <h2>
            ملخص الطلب
          </h2>

          <div id="order-items"></div>

          <div class="summary">

            <div class="summary-row">

              <span>
                إجمالي المنتجات
              </span>

              <strong id="order-subtotal">
                0.00 ج.م
              </strong>

            </div>


            <div class="summary-row">

              <span>
                التوصيل
              </span>

              <strong id="order-delivery">
                0.00 ج.م
              </strong>

            </div>


            <div class="summary-row total">

              <span>
                الإجمالي النهائي
              </span>

              <strong id="order-total">
                0.00 ج.م
              </strong>

            </div>

          </div>

        </section>

      </div>

    </div>

  </main>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js"></script>


  <!-- =========================
       LEAFLET
       ========================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- =========================
       CHECKOUT SCRIPT
       ========================= -->

  <script>

    const Checkout = {

      // =====================================================
      // STATE
      // =====================================================

      cart: [],

      map: null,

      pharmacyMarker: null,

      customerMarker: null,

      customerLocation: null,

      deliveryDistanceKm: 0,

      deliveryFee: 0,
      pricePerKm: 0,

      // =====================================================
      // PHARMACY LOCATION
      // =====================================================

      pharmacyLocation: {

        latitude:
          31.25117090705062,

        longitude:
          30.0052725711635

      },


      // =====================================================
      // INIT
      // =====================================================

      async init() {

        console.log(
          '🧾 Checkout starting...'
        );


       this.loadCart();

       this.render();

       this.bindEvents();

       this.initMap();

await this.loadDeliverySettings();

if (this.customerLocation) {
  this.updateDeliveryFee();
}


        console.log(
          '✅ Checkout ready'
        );

      },


      // =====================================================
      // LOAD CART
      // =====================================================

      loadCart() {

        try {

          const saved =
            localStorage.getItem(
              'hamsa_cart'
            );

          const parsed =
            saved
              ? JSON.parse(saved)
              : [];


          this.cart =
            Array.isArray(parsed)
              ? parsed
              : [];


        } catch (error) {

          console.error(
            '❌ Cart loading error:',
            error
          );


          this.cart = [];

        }

      },


      // =====================================================
      // RENDER
      // =====================================================

      render() {

        const container =
          document.getElementById(
            'order-items'
          );


        const submitButton =
          document.getElementById(
            'submit-order'
          );


        if (!container) {
          return;
        }


        if (!this.cart.length) {

          container.innerHTML = `

            <div class="empty-cart">

              <div class="empty-cart-icon">
                🛒
              </div>

              <h3>
                السلة فارغة
              </h3>

              <p>
                أضف منتجات أولًا ثم ارجع لإتمام الطلب.
              </p>

              <a href="index.html">
                العودة للمتجر
              </a>

            </div>

          `;


          this.updateSummary(
            0,
            0
          );


          if (submitButton) {
            submitButton.disabled = true;
          }


          return;

        }


        container.innerHTML =
          this.cart
            .map(
              item => {

                const price =
                  Number(
                    item.price
                  ) || 0;


                const quantity =
                  Number(
                    item.quantity
                  ) || 0;


                const total =
                  price *
                  quantity;


                const image =
                  item.image || '';


                return `

                  <div class="order-item">

                    <div class="order-item-image">

                      ${
                        image

                          ? `

                            <img
                              src="${this.escape(image)}"
                              alt="${this.escape(item.name)}"
                            >

                          `

                          : `

                            <span>
                              💊
                            </span>

                          `
                      }

                    </div>


                    <div class="order-item-info">

                      <h3>
                        ${this.escape(
                          item.name
                        )}
                      </h3>

                      <p>
                        الكمية:
                        ${quantity}
                      </p>

                      <p>
                        السعر:
                        ${price.toFixed(2)}
                        ج.م
                      </p>

                    </div>


                    <div class="order-item-total">

                      ${total.toFixed(2)}
                      ج.م

                    </div>

                  </div>

                `;

              }
            )
            .join('');


        const subtotal =
          this.getSubtotal();


        this.deliveryFee = 0;


        this.updateSummary(
          subtotal,
          this.deliveryFee
        );


        if (submitButton) {
          submitButton.disabled = false;
        }

      },


      // =====================================================
      // UPDATE SUMMARY
      // =====================================================

      updateSummary(
        subtotal,
        deliveryFee
      ) {

        const subtotalElement =
          document.getElementById(
            'order-subtotal'
          );


        const deliveryElement =
          document.getElementById(
            'order-delivery'
          );


        const totalElement =
          document.getElementById(
            'order-total'
          );


        const safeSubtotal =
          Number(
            subtotal
          ) || 0;


        const safeDelivery =
          Number(
            deliveryFee
          ) || 0;


        const total =
          safeSubtotal +
          safeDelivery;


        if (subtotalElement) {

          subtotalElement.textContent =
            `${safeSubtotal.toFixed(2)} ج.م`;

        }


        if (deliveryElement) {

          deliveryElement.textContent =
            `${safeDelivery.toFixed(2)} ج.م`;

        }


        if (totalElement) {

          totalElement.textContent =
            `${total.toFixed(2)} ج.م`;

        }

      },


      // =====================================================
      // GET SUBTOTAL
      // =====================================================

      getSubtotal() {

        return this.cart.reduce(
          (
            sum,
            item
          ) => {

            const price =
              Number(
                item.price
              ) || 0;


            const quantity =
              Number(
                item.quantity
              ) || 0;


            return (
              sum +
              (
                price *
                quantity
              )
            );

          },
          0
        );

      },


      // =====================================================
      // EVENTS
      // =====================================================

      bindEvents() {

        const form =
          document.getElementById(
            'checkout-form'
          );


        if (form) {

          form.addEventListener(
            'submit',
            event => {

              event.preventDefault();

              this.submitOrder();

            }
          );

        }


        const locationButton =
          document.getElementById(
            'get-location-button'
          );


        if (locationButton) {

          locationButton.addEventListener(
            'click',
            () => {

              this.getCustomerLocation();

            }
          );

        }

      },


      // =====================================================
      // INIT MAP
      // =====================================================
async loadDeliverySettings() {

  try {

    if (
      typeof supabaseClient === 'undefined'
    ) {
      throw new Error(
        'Supabase client غير متاح'
      );
    }

    const {
      data,
      error
    } = await supabaseClient
      .from('settings')
      .select('data')
      .eq('id', 'delivery_settings')
      .maybeSingle();

    if (error) {
      throw error;
    }

    const price =
      Number(
        data?.data?.delivery?.price_per_km
      );

    this.pricePerKm =
      Number.isFinite(price)
        ? price
        : 0;

    console.log(
      '🚚 Price per km:',
      this.pricePerKm
    );

  } catch (error) {

    console.error(
      '❌ Delivery settings error:',
      error
    );

    this.pricePerKm = 0;

  }

},
      initMap() {

        const mapElement =
          document.getElementById(
            'delivery-map'
          );


        if (!mapElement) {

          console.error(
            '❌ Delivery map element not found'
          );

          return;

        }


        if (typeof L === 'undefined') {

          console.error(
            '❌ Leaflet not loaded'
          );

          return;

        }


        try {

          this.map =
            L.map(
              'delivery-map'
            ).setView(

              [
                this.pharmacyLocation.latitude,
                this.pharmacyLocation.longitude
              ],

              14

            );


          L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {

              maxZoom:
                19,

              attribution:
                '&copy; OpenStreetMap contributors'

            }
          ).addTo(
            this.map
          );


          // =================================================
          // PHARMACY MARKER
          // =================================================

          this.pharmacyMarker =
            L.marker(
              [
                this.pharmacyLocation.latitude,
                this.pharmacyLocation.longitude
              ]
            )
            .addTo(
              this.map
            )
            .bindPopup(
              `
                <div class="pharmacy-label">
                  🏥 صيدليات الهمسة
                </div>
              `
            );


          // =================================================
          // MANUAL LOCATION
          // =================================================

          this.map.on(
            'click',
            event => {

              const latitude =
                event.latlng.lat;


              const longitude =
                event.latlng.lng;


              this.setCustomerLocation(
                latitude,
                longitude
              );

            }
          );


          console.log(
            '✅ Map initialized'
          );


        } catch (error) {

          console.error(
            '❌ Map initialization error:',
            error
          );

        }

      },


      // =====================================================
      // GET CUSTOMER GPS
      // =====================================================

      getCustomerLocation() {

        const button =
          document.getElementById(
            'get-location-button'
          );


        const info =
          document.getElementById(
            'location-info'
          );


        if (!navigator.geolocation) {

          if (info) {

            info.textContent =
              'المتصفح لا يدعم تحديد الموقع.';

          }

          return;

        }


        if (!this.map) {

          if (info) {

            info.textContent =
              'الخريطة لم يتم تحميلها بعد.';

          }

          return;

        }


        if (button) {

          button.disabled = true;

          button.textContent =
            '📍 جاري تحديد موقعك...';

        }


        if (info) {

          info.textContent =
            'جاري محاولة تحديد موقعك...';

        }


        navigator.geolocation.getCurrentPosition(

          position => {

            const latitude =
              position.coords.latitude;


            const longitude =
              position.coords.longitude;


            this.setCustomerLocation(
              latitude,
              longitude
            );


            if (button) {

              button.disabled = false;

              button.textContent =
                '📍 تحديث موقعي';

            }

          },


          error => {

            console.error(
              '❌ Geolocation error:',
              error
            );


            let message =
              'تعذر تحديد موقعك.';


            if (
              error.code === 1
            ) {

              message =
                'تم رفض إذن الموقع. اسمحي للمتصفح بالوصول إلى موقعك ثم حاولي مرة أخرى.';

            }

            else if (
              error.code === 2
            ) {

              message =
                'تعذر الحصول على موقعك. تأكدي من تشغيل خدمات الموقع.';

            }

            else if (
              error.code === 3
            ) {

              message = `
                ⚠️ لم يتم تحديد الموقع تلقائيًا.
                <br>
                يمكنك الضغط على الخريطة لتحديد مكان التوصيل يدويًا.
              `;

            }


            if (info) {

              if (
                error.code === 3
              ) {

                info.innerHTML =
                  message;

              } else {

                info.textContent =
                  message;

              }

            }


            if (button) {

              button.disabled = false;

              button.textContent =
                '📍 تحديد موقعي الحالي';

            }

          },


          {
            enableHighAccuracy:
              false,

            timeout:
              30000,

            maximumAge:
              300000
          }

        );

      },


      // =====================================================
      // SET CUSTOMER LOCATION
      // =====================================================

      setCustomerLocation(
        latitude,
        longitude
      ) {

        const safeLatitude =
          Number(
            latitude
          );


        const safeLongitude =
          Number(
            longitude
          );


        if (
          !Number.isFinite(
            safeLatitude
          ) ||
          !Number.isFinite(
            safeLongitude
          )
        ) {

          console.error(
            '❌ Invalid customer coordinates:',
            latitude,
            longitude
          );

          return;

        }


        if (!this.map) {

          console.error(
            '❌ Map is not initialized'
          );

          return;

        }


        this.customerLocation = {

          latitude:
            safeLatitude,

          longitude:
            safeLongitude

        };


        // =================================================
        // REMOVE OLD CUSTOMER MARKER
        // =================================================

        if (
          this.customerMarker
        ) {

          this.map.removeLayer(
            this.customerMarker
          );

        }


        // =================================================
        // CUSTOMER MARKER
        // =================================================

        this.customerMarker =
          L.marker(
            [
              safeLatitude,
              safeLongitude
            ]
          )
          .addTo(
            this.map
          )
          .bindPopup(
            '📍 موقع التوصيل'
          )
          .openPopup();


        // =================================================
        // CALCULATE DISTANCE
        // =================================================

        this.deliveryDistanceKm =
          this.calculateDistanceKm
            (
              this.pharmacyLocation.latitude,

              this.pharmacyLocation.longitude,

              safeLatitude,

              safeLongitude

            );


        // =================================================
        // CENTER MAP
        // =================================================

        const bounds =
          L.latLngBounds(

            [
              this.pharmacyLocation.latitude,
              this.pharmacyLocation.longitude
            ],

            [
              safeLatitude,
              safeLongitude
            ]

          );


        this.map.fitBounds(
          bounds,
          {
            padding: [
              40,
              40
            ]
          }
        );


        // =================================================
        // UPDATE LOCATION INFO
        // =================================================

        const info =
          document.getElementById(
            'location-info'
          );


        if (info) {

          info.innerHTML = `
            ✅ تم تحديد موقع التوصيل
            <br>
            خط العرض:
            ${safeLatitude.toFixed(6)}
            <br>
            خط الطول:
            ${safeLongitude.toFixed(6)}
          `;

        }


        // =================================================
        // UPDATE DISTANCE
        // =================================================

        const distanceInfo =
          document.getElementById(
            'distance-info'
          );


        const distanceElement =
          document.getElementById(
            'delivery-distance'
          );


        if (distanceElement) {

          distanceElement.textContent =
            `${this.deliveryDistanceKm.toFixed(2)} كم`;

        }


        if (distanceInfo) {

          distanceInfo.hidden = false;

        }


        console.log(
          '📍 Customer location:',
          this.customerLocation
        );


        console.log(
          '📏 Delivery distance:',
          this.deliveryDistanceKm,
          'km'
        );
          this.updateDeliveryFee();
      },


      // =====================================================
      // HAVERSINE DISTANCE
      // =====================================================

      calculateDistanceKm(
        lat1,
        lon1,
        lat2,
        lon2
      ) {

        const earthRadiusKm =
          6371;


        const toRadians =
          degrees =>
            degrees *
            (
              Math.PI / 180
            );


        const dLat =
          toRadians(
            lat2 - lat1
          );


        const dLon =
          toRadians(
            lon2 - lon1
          );


        const a =
          Math.sin(
            dLat / 2
          ) ** 2
          +
          Math.cos(
            toRadians(lat1)
          )
          *
          Math.cos(
            toRadians(lat2)
          )
          *
          Math.sin(
            dLon / 2
          ) ** 2;


        const c =
          2 *
          Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
          );


        return (
          earthRadiusKm *
          c
        );

      },


      // =====================================================
      // SUBMIT ORDER
      // =====================================================

      async submitOrder() {

        if (!this.cart.length) {

          this.showMessage(
            'السلة فارغة',
            true
          );

          return;

        }


        const name =
          document
            .getElementById(
              'customer-name'
            )
            ?.value
            .trim() || '';


        const phone =
          document
            .getElementById(
              'customer-phone'
            )
            ?.value
            .trim() || '';


        const address =
          document
            .getElementById(
              'customer-address'
            )
            ?.value
            .trim() || '';


        const paymentMethod =
          document
            .getElementById(
              'payment-method'
            )
            ?.value || '';


        const notes =
          document
            .getElementById(
              'order-notes'
            )
            ?.value
            .trim() || '';


        if (
          !name ||
          !phone ||
          !address ||
          !paymentMethod
        ) {

          this.showMessage(
            'برجاء إدخال جميع البيانات المطلوبة.',
            true
          );

          return;

        }


        const subtotal =
          this.getSubtotal();


        /*
         * الرسوم حاليًا = صفر.
         * سيتم ربطها لاحقًا بسعر الكيلومتر
         * الذي يحدده الأدمن.
         */

        const deliveryFee =
          0;


        this.deliveryFee =
          deliveryFee;


        const total =
          subtotal +
          deliveryFee;


        const items =
          this.cart.map(
            item => ({

              id:
                item.id,

              sku:
                item.sku || null,

              name:
                item.name || '',

              price:
                Number(
                  item.price
                ) || 0,

              quantity:
                Number(
                  item.quantity
                ) || 0,

              is_offer:
                Boolean(
                  item.is_offer
                ),

              image:
                item.image || null

            })
          );


        const order = {

          id:
            this.generateOrderId(),

          user_id:
            null,

          customer_name:
            name,

          customer_phone:
            phone,

          customer_address:
            address,

          items:
            items,

          subtotal:
            subtotal,

          delivery_fee:
            deliveryFee,

          total:
            total,

          status:
            'pending',

          payment_method:
            paymentMethod,

          notes:
            notes || null,

          delivery_notified:
            false

        };


        const button =
          document.getElementById(
            'submit-order'
          );


        if (button) {

          button.disabled = true;

          button.textContent =
            'جاري إرسال الطلب...';

        }


        try {

          if (
            typeof supabaseClient ===
            'undefined'
          ) {

            throw new Error(
              'Supabase client غير متاح'
            );

          }


          const {
            error
          } =
            await supabaseClient
              .from('orders')
              .insert(order);


          if (error) {

            console.error(
              '❌ Order insert error:',
              error
            );

            throw error;

          }


          console.log(
            '✅ Order created:',
            order
          );


          // Clear cart

          localStorage.removeItem(
            'hamsa_cart'
          );


          this.cart = [];


          // Success message

          this.showMessage(

            `تم إرسال طلبك بنجاح 🎉
رقم الطلب: ${order.id}`,

            false

          );


          this.updateSummary(
            0,
            0
          );


          const itemsContainer =
            document.getElementById(
              'order-items'
            );


          if (itemsContainer) {

            itemsContainer.innerHTML = `

              <div class="empty-cart">

                <div class="empty-cart-icon">
                  ✅
                </div>

                <h3>
                  تم تأكيد الطلب بنجاح
                </h3>

                <p>
                  رقم الطلب:
                  <strong>
                    ${this.escape(
                      order.id
                    )}
                  </strong>
                </p>

                <a href="index.html">
                  العودة للمتجر
                </a>

              </div>

            `;

          }


          if (button) {

            button.textContent =
              'تم تأكيد الطلب ✓';

            button.disabled = true;

          }


        } catch (error) {

          console.error(
            '❌ Failed to create order:',
            error
          );


          this.showMessage(
            'حدث خطأ أثناء إرسال الطلب. برجاء المحاولة مرة أخرى.',
            true
          );


          if (button) {

            button.disabled = false;

            button.textContent =
              'تأكيد الطلب';

          }

        }

      },


      // =====================================================
      // GENERATE ORDER ID
      // =====================================================

      generateOrderId() {

        return (

          'ORD-' +

          Date.now() +

          '-' +

          Math.random()
            .toString(36)
            .substring(
              2,
              8
            )
            .toUpperCase()

        );

      },


      // =====================================================
      // MESSAGE
      // =====================================================

      showMessage(
        message,
        error = false
      ) {

        const element =
          document.getElementById(
            'checkout-message'
          );


        if (!element) {
          return;
        }


        element.textContent =
          message;


        element.className =
          `message ${
            error
              ? 'error'
              : 'success'
          }`;

      },


      // =====================================================
      // ESCAPE
      // =====================================================

      escape(value) {

        return String(
          value ?? ''
        )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );

      }

    };


    // =======================================================
    // START
    // =======================================================

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        Checkout.init();

      }
    );

  </script>
